services:
  # Downloads Cricsheet data, builds DuckDB and trains the models into ./data (skips the download if present)
  pipeline:
    build: .
    command: python -m src.pipeline
    volumes:
      - ./data:/app/data

  dashboard:
    build: .
    container_name: cricket_dashboard
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      pipeline:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build: .
    container_name: cricket_api
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      pipeline:
        condition: service_completed_successfully
    restart: unless-stopped
